# Runs on every push and pull request once this folder is its own GitHub repository.
# Tests use a throwaway Postgres that GitHub starts for the job, so CI never touches Neon.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scamwatch
          POSTGRES_PASSWORD: scamwatch
          POSTGRES_DB: scamwatch_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U scamwatch" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://scamwatch:scamwatch@localhost:5432/scamwatch_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
