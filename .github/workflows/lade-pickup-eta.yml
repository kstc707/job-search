name: lade-pickup-eta

on:
  push:
    paths: ["projects/lade-pickup-eta/**", ".github/workflows/lade-pickup-eta.yml"]
  pull_request:
    paths: ["projects/lade-pickup-eta/**", ".github/workflows/lade-pickup-eta.yml"]

defaults:
  run:
    working-directory: projects/lade-pickup-eta

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lade
          POSTGRES_PASSWORD: lade
          POSTGRES_DB: lade_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lade" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://lade:lade@localhost:5432/lade_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: projects/lade-pickup-eta/requirements*.txt
      - run: pip install -r requirements.txt
      - run: pytest

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements-api.txt
      - name: Demo model bundle (synthetic data, no download)
        run: python scripts/demo_bundle.py artifacts/bundle.joblib
      - run: docker build -t lade-pickup-eta .
      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 lade-pickup-eta
          for i in $(seq 1 30); do curl -sf localhost:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1
